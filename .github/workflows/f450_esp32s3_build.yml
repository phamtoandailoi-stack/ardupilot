name: F450 ESP32-S3 Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/f450-esp32s3-bmi323-bringup
    paths:
      - '.github/workflows/f450_esp32s3_build.yml'
      - 'ArduCopter/**'
      - 'libraries/AP_HAL_ESP32/**'
      - 'libraries/AP_InertialSensor/**'

concurrency:
  group: f450-esp32s3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-copter:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-esp32:v0.2.0
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build ArduCopter for esp32s3f450
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          source "${IDF_PATH}/export.sh"
          ./waf configure --board esp32s3f450
          ./waf copter

      - name: Collect flash images
        shell: bash
        run: |
          cp build/esp32s3f450/esp-idf_build/ardupilot.bin ArduCopter.esp32s3f450.bin
          cp build/esp32s3f450/esp-idf_build/ardupilot.elf ArduCopter.esp32s3f450.elf
          cp build/esp32s3f450/esp-idf_build/bootloader/bootloader.bin bootloader.esp32s3f450.bin
          cp build/esp32s3f450/esp-idf_build/partition_table/partition-table.bin partition-table.esp32s3f450.bin
          cp build/esp32s3f450/esp-idf_build/flash_project_args flash_project_args.esp32s3f450

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp32s3f450-arducopter
          path: |
            ArduCopter.esp32s3f450.bin
            ArduCopter.esp32s3f450.elf
            bootloader.esp32s3f450.bin
            partition-table.esp32s3f450.bin
            flash_project_args.esp32s3f450
          retention-days: 14
